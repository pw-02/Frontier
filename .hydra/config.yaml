  decode_cuda_graph_mode: piecewise
  max_model_len: 17000
  max_tokens_in_batch: 2048
  block_size: 16
  num_blocks: 8192
  enable_prefix_caching: true
  enable_chunked_prefill: true
policy:
  name: fixed
experiment:
  skip_completed: true
  name: fixed4_r10_combined_half
metrics:
  slo_seconds: 30

defaults:
  - workload: mooncake_r34
  - resources: transient_large
  - model: qwen3_8b_a100
  - calibration: baseline
  - scheduler: vllm_v1
  - policy: transient
  - case: e4
  - _self_

experiment:
  skip_completed: true
  group: null
  name: ${resources.label}_r${workload.rate}

metrics:
  slo_seconds: 30

hydra:
  run:
    dir: .
  job:
    chdir: false
  sweep:
    dir: outputs/hydra
    subdir: ${hydra.job.num}
